<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qedy Music Maker</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">QEDY<span>music maker</span></div>

        <div class="transport-group">
          <button id="stop-btn" class="tbtn" title="Stop">■</button>
          <button id="play-btn" class="tbtn play" title="Play">▶</button>
          <button id="pause-btn" class="tbtn" title="Pause">⏸</button>
          <button id="rec-btn" class="tbtn rec" title="Record (count-in, then play your keys)">●</button>
        </div>

        <div class="lcd-group">
          <label class="lcd">
            <span>BPM</span>
            <input id="bpm-input" type="number" min="40" max="300" value="120" />
          </label>
          <label class="lcd">
            <span>LENGTH</span>
            <select id="length-select">
              <option value="32">2 bars</option>
              <option value="64">4 bars</option>
              <option value="128">8 bars</option>
              <option value="256">16 bars</option>
              <option value="512">32 bars</option>
            </select>
          </label>
          <label class="lcd wide">
            <span>PROJECT</span>
            <input id="project-name-input" type="text" value="Untitled Project" />
          </label>
        </div>

        <span id="status" class="status"></span>

        <div class="topbar-right">
          <button id="save-project" class="btn small" title="Save project">💾 Save</button>
          <button id="load-project" class="btn small" title="Load project">📂 Load</button>
          <input id="load-project-input" type="file" accept=".qedy,application/json" hidden />
          <div class="btn-group" title="Export">
            <button id="export-wav" class="btn small">WAV</button>
            <button id="export-mp3" class="btn small">MP3</button>
            <button id="export-ogg" class="btn small">OGG</button>
          </div>
          <div class="scope-panel"><canvas id="oscilloscope" width="400" height="100"></canvas></div>
        </div>
      </header>

      <nav class="mobile-tabs">
        <button class="mobile-tab-btn" data-tab="tracks">Tracks</button>
        <button class="mobile-tab-btn" data-tab="controls">Tools</button>
        <button class="mobile-tab-btn active" data-tab="editor">Editor</button>
      </nav>

      <div class="app-body">
        <aside class="tracks-sidebar">
          <section class="tracks-panel">
            <div class="sidebar-header">
              <h2>TRACKS</h2>
              <button id="add-track" class="btn small">+ Add</button>
            </div>
            <div id="track-tabs" class="track-list"></div>
          </section>
        </aside>

        <main class="main-column">
          <section class="editor-panel">
            <div class="view-tabs">
              <button class="view-tab active" data-view="roll">Piano Roll</button>
              <button class="view-tab" data-view="mixer">Mixer</button>
              <span class="spacer"></span>
              <button id="undo-btn" class="btn small" title="Undo (Ctrl+Z)">↶</button>
              <button id="redo-btn" class="btn small" title="Redo (Ctrl+Y)">↷</button>
            </div>
            <div id="track-controls" class="track-controls"></div>
            <div id="piano-roll-container"></div>
            <div id="mixer" class="mixer" hidden></div>
          </section>
        </main>

        <aside class="controls-sidebar">
          <section class="side-card auto-build-panel">
            <h2>AUTO BUILD</h2>
            <div class="transport-row">
              <label class="range-label">
                Root
                <select id="ab-root"></select>
              </label>
              <label class="range-label">
                Scale
                <select id="ab-scale">
                  <option value="major">Major</option>
                  <option value="minor">Minor</option>
                  <option value="pentatonicMajor">Pentatonic Major</option>
                  <option value="pentatonicMinor">Pentatonic Minor</option>
                  <option value="chromatic">Chromatic</option>
                </select>
              </label>
            </div>
            <label class="density-label">
              Density
              <input id="ab-density" type="range" min="0.1" max="0.9" step="0.05" value="0.4" />
            </label>
            <div class="transport-row">
              <label class="checkbox-label">
                <input id="ab-instruments" type="checkbox" checked />
                Instruments
              </label>
              <label class="checkbox-label">
                <input id="ab-tempo" type="checkbox" />
                Tempo
              </label>
            </div>
            <button id="auto-build-btn" class="btn primary">🎲 Auto Build All</button>
          </section>

          <section class="side-card demo-panel">
            <h2>DEMO LIBRARY</h2>
            <select id="demo-select"></select>
            <p id="demo-description" class="demo-description"></p>
            <button id="load-demo-btn" class="btn">▶ Load Demo</button>
          </section>
        </aside>
      </div>

      <footer class="dock live-panel">
        <div class="dock-col">
          <h2>LIVE <span id="live-octave"></span></h2>
          <select id="live-instrument" title="Instrument"></select>
          <div class="transport-row">
            <select id="live-root" title="Root note"></select>
            <select id="live-scale" title="Scale">
              <option value="chromatic">Chromatic</option>
              <option value="major">Major</option>
              <option value="minor">Minor</option>
              <option value="pentatonicMajor">Pent. Major</option>
              <option value="pentatonicMinor">Pent. Minor</option>
            </select>
          </div>
        </div>

        <div class="dock-keys">
          <div id="live-keys" class="live-keys"></div>
          <p class="demo-description keys-help">
            A S D F G H J K L Ş İ = notes · W E T Y U O P = black keys · Z / X = octave · Space = sustain ·
            Shift+click a note = length · drag a note to move it
          </p>
        </div>

        <div class="dock-col">
          <h2>RECORD / PLAY</h2>
          <div class="transport-row">
            <select id="rec-quant" title="Quantize">
              <option value="1">Snap 1/16</option>
              <option value="2">Snap 1/8</option>
              <option value="4">Snap 1/4</option>
            </select>
            <button id="rec-undo" class="btn small" disabled>↶ Undo take</button>
          </div>
          <div class="checks">
            <label class="checkbox-label"><input id="live-loopmode" type="checkbox" /> Key-loop</label>
            <label class="checkbox-label"><input id="live-chord" type="checkbox" /> Chords</label>
            <label class="checkbox-label"><input id="live-metro" type="checkbox" /> Metronome</label>
          </div>
        </div>

        <div class="dock-col">
          <h2>RHYTHM</h2>
          <select id="live-rhythm"></select>
          <button id="live-drums" class="btn small">▶ Drums</button>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
